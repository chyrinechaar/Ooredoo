<div class="container mt-4">
  <!-- Navigation Tabs -->
  <ul class="nav nav-tabs mb-4">
    <li class="nav-item">
      <button
        class="nav-link"
        [class.active]="selectedNav === 'dashboard'"
        (click)="selectedNav = 'dashboard'"
      >
        Dashboard
      </button>
    </li>
    <li class="nav-item">
      <button
        class="nav-link"
        [class.active]="selectedNav === 'products'"
        (click)="selectedNav = 'products'"
      >
        Products
      </button>
    </li>
  </ul>

  <!-- Dashboard View -->
  <ng-container *ngIf="selectedNav === 'dashboard'">
    <div class="row g-3 mb-4">
      <div
        class="col-12 col-md-6 col-lg-3"
        *ngFor="let card of cards"
      >
        <div
          class="card h-100 bg-light"
          style="padding-top: 30px; border-color: red; text-align: center"
        >
          <div class="card-body d-flex flex-column">
            <h3 class="card-title text-danger text-capitalize mb-5">
              {{ card.title }}
            </h3>
            <div class="mt-auto">
              <div
                class="d-flex justify-content-between align-items-center mb-5"
              >
                <span class="fw-bold">Total Sales:</span>
                <span class="badge bg-danger rounded-pill">
                  {{ card.totalSales }}
                </span>
              </div>
              <div
                class="d-flex justify-content-between align-items-center mb-5"
              >
                <span class="fw-bold">Best Seller:</span>
                <span class="text-truncate">{{ card.bestSeller }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Products View -->
  <ng-container *ngIf="selectedNav === 'products'">
    <div class="row g-3">
      <div
        class="col-md-6 col-lg-4"
        *ngFor="let product of products"
      >
        <div class="card border-primary h-100">
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p>Category: {{ product.category }}</p>
            <p>Sales: {{ product.salesCount }}</p>
            <p>Price: {{ product.price | currency }}</p>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
